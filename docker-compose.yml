version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ats_postgres
    restart: always
    environment:
      POSTGRES_USER: ats_user
      POSTGRES_PASSWORD: ats_secure_password_2026
      POSTGRES_DB: ats_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats_user -d ats_database"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ats_network

  redis:
    image: redis:7-alpine
    container_name: ats_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ats_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ats_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://ats_user:ats_secure_password_2026@db:5432/ats_database
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=ats_jwt_super_secret_production_key_change_in_env_2026
      - USE_IN_PROCESS_TASKS=false
      - ENABLE_OCR=true
      - ENABLE_LLM_ENRICHMENT=false
      - UPLOAD_DIR=/app/uploads
    ports:
      - "8000:8000"
    volumes:
      - resume_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ats_network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ats_celery_worker
    restart: always
    command: ["celery", "-A", "app.services.queue.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    environment:
      - DATABASE_URL=postgresql://ats_user:ats_secure_password_2026@db:5432/ats_database
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=ats_jwt_super_secret_production_key_change_in_env_2026
      - USE_IN_PROCESS_TASKS=false
      - ENABLE_OCR=true
      - UPLOAD_DIR=/app/uploads
    volumes:
      - resume_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ats_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ats_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ats_network

volumes:
  postgres_data:
  redis_data:
  resume_uploads:

networks:
  ats_network:
    driver: bridge
